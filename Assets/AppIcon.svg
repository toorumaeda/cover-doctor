<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0.05" x2="0.9" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="0.5" stop-color="#3f58f2"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient>
    <linearGradient id="skyBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3cc2ff"/><stop offset="1" stop-color="#2f7dff"/></linearGradient>
    <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a54d6"/><stop offset=".55" stop-color="#c0589a"/><stop offset="1" stop-color="#ffa45c"/></linearGradient>
    <clipPath id="screenClip"><rect x="244" y="396" width="160" height="128" rx="14"/></clipPath>
    <clipPath id="photoWrong"><rect x="662" y="370" width="146" height="96" rx="8"/></clipPath>
    <clipPath id="photoOk"><rect x="636" y="650" width="160" height="104" rx="8"/></clipPath>
    <clipPath id="docClip"><circle cx="520" cy="520" r="98"/></clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#10104a" flood-opacity=".4"/></filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#10104a" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g transform="translate(519 540) scale(1.28) translate(-519 -540)">

  <!-- iPhone（音楽プレーヤーの画面） -->
  <g filter="url(#sh)">
    <rect x="212" y="322" width="224" height="388" rx="46" fill="#161c36" stroke="#eef0ff" stroke-width="12"/>
    <rect x="282" y="340" width="84" height="16" rx="8" fill="#0a0e20"/>
    <g clip-path="url(#screenClip)">
      <rect x="244" y="396" width="160" height="128" fill="url(#skyBlue)"/>
      <circle cx="366" cy="430" r="13" fill="#f4eaff"/>
      <path d="M244 524 L244 486 L300 440 L342 478 L368 458 L404 492 L404 524Z" fill="#e8f3ff" opacity=".95"/>
      <path d="M244 524 L244 506 L292 470 L336 506 L372 488 L404 512 L404 524Z" fill="#b9dcff"/>
    </g>
    <line x1="244" y1="566" x2="404" y2="566" stroke="#eef0ff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <line x1="244" y1="566" x2="312" y2="566" stroke="#eef0ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="312" cy="566" r="7" fill="#fff"/>
    <g fill="#fff"><path d="M262 616 l22 -14 v28z M284 616 l22 -14 v28z"/><path d="M314 598 l34 18 -34 18z"/><path d="M356 602 l20 14 -20 14z M376 602 l20 14 -20 14z" opacity=".8"/></g>
  </g>

  <!-- 誤った画像（×） -->
  <g filter="url(#sh2)">
    <path d="M644 340 H776 L826 392 V480 Q826 496 810 496 H644 Q628 496 628 480 V356 Q628 340 644 340Z" fill="#fff"/>
    <path d="M776 340 V380 Q776 392 788 392 H826Z" fill="#dfe4ff"/>
    <g clip-path="url(#photoWrong)">
      <rect x="662" y="370" width="146" height="96" fill="url(#skyWarm)"/>
      <circle cx="770" cy="402" r="11" fill="#fff4f0"/>
      <path d="M662 466 L662 440 L704 410 L736 438 L762 424 L808 456 L808 466Z" fill="#7a5a9a"/>
    </g>
    <circle cx="798" cy="486" r="26" fill="#ff5a6a" stroke="#fff" stroke-width="6"/>
    <path d="M788 476 L808 496 M808 476 L788 496" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 正しい画像（✓） -->
  <g filter="url(#sh2)">
    <path d="M618 618 H758 L812 674 V764 Q812 780 796 780 H618 Q602 780 602 764 V634 Q602 618 618 618Z" fill="#fff"/>
    <path d="M758 618 V658 Q758 674 774 674 H812Z" fill="#dfe4ff"/>
    <g clip-path="url(#photoOk)">
      <rect x="636" y="650" width="160" height="104" fill="url(#skyBlue)"/>
      <circle cx="760" cy="680" r="11" fill="#f4eaff"/>
      <path d="M636 754 L636 722 L688 678 L726 714 L752 694 L796 730 L796 754Z" fill="#e8f3ff"/>
      <path d="M636 754 L636 738 L684 700 L722 736 L752 722 L796 744 L796 754Z" fill="#b9dcff"/>
    </g>
    <circle cx="790" cy="760" r="28" fill="#22cc99" stroke="#fff" stroke-width="6"/>
    <path d="M776 760 L786 770 L806 750" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 矢印: 誤り → 先生 → 正しい → iPhone -->
  <g fill="none" stroke="#d7e4ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M636 430 C600 420 578 432 572 456"/><path d="M586 462 L572 448 L558 466"/>
    <path d="M722 512 C740 540 738 566 716 598"/><path d="M700 584 L716 600 L726 580"/>
    <path d="M606 712 C580 722 556 712 540 694"/><path d="M552 710 L538 692 L560 688"/>
  </g>

  <!-- 先生（ヘッドミラーと聴診器） -->
  <g filter="url(#sh)">
    <circle cx="520" cy="520" r="106" fill="#fff"/>
    <g clip-path="url(#docClip)">
      <ellipse cx="520" cy="612" rx="74" ry="52" fill="#2a47b8"/>
      <circle cx="520" cy="508" r="40" fill="#2a47b8"/>
      <path d="M476 490 Q520 476 564 490" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="520" cy="478" r="15" fill="#fff"/><circle cx="520" cy="478" r="8" fill="#2a47b8"/>
      <path d="M492 566 V586 a11 11 0 0 0 22 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M548 566 V586 a11 11 0 0 1 -22 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="508" cy="598" r="6" fill="#fff"/><circle cx="534" cy="598" r="6" fill="#fff"/>
    </g>
  </g>
  </g>
</svg>
